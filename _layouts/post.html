---
layout: default
---
<div class="post-layout">
  <article class="post">
    <header class="post-header">
      <h1>{{ page.title }}</h1>
      <p class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
        {% if page.categories.size > 0 %}<span class="sep">·</span><span class="post-category">{{ page.categories | join: " / " }}</span>{% endif %}
      </p>
      {% if page.tags.size > 0 %}
      <p class="post-tags">
        {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
      </p>
      {% endif %}
    </header>

    <div class="post-body">
      {{ content }}
    </div>

    <footer class="post-footer">
      <a href="{{ '/' | relative_url }}">← 返回首页</a>
    </footer>
  </article>

  <aside class="post-aside">
    <nav class="toc" id="toc" aria-labelledby="toc-title" data-hide-title-when-empty>
      <p class="toc-title" id="toc-title">目录</p>
      <ol class="toc-list" id="toc-list"></ol>
      <p class="toc-empty" id="toc-empty" hidden>本文未分节</p>
    </nav>
  </aside>
</div>
